<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Характер от рождения</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --fon: var(--tg-theme-bg-color, #F8F5F1);
    --tekst: var(--tg-theme-text-color, #22312F);
    --tih: var(--tg-theme-hint-color, #7D8C8A);
    --karta: var(--tg-theme-secondary-bg-color, #ffffff);
    --akcent: #2A5D67;
    --akcent-svet: #DFEBEC;
    --liniya: rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--fon); color: var(--tekst);
         font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .shapka { position: sticky; top: 0; z-index: 5; background: var(--fon);
            padding: 12px 16px 10px; border-bottom: 1px solid var(--liniya); }
  .shapka h1 { font-size: 18px; margin: 0 0 4px; }
  .shapka .podsk { font-size: 13px; color: var(--tih); }
  .polosa { height: 6px; border-radius: 3px; background: var(--akcent-svet); margin-top: 8px; overflow: hidden; }
  .polosa div { height: 100%; width: 0; background: var(--akcent); transition: width .2s; }
  main { padding: 8px 16px 110px; max-width: 640px; margin: 0 auto; }
  .vopros { background: var(--karta); border-radius: 14px; padding: 14px 14px 12px; margin: 10px 0;
            border: 1px solid var(--liniya); }
  .vopros.est { border-color: var(--akcent-svet); }
  .vopros p { margin: 0 0 10px; font-weight: 600; }
  .vopros .n { color: var(--tih); font-size: 13px; margin-right: 4px; font-weight: 400; }
  .knopki { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .knopki button { border: 1px solid var(--liniya); background: transparent; color: var(--tekst);
                   border-radius: 10px; padding: 9px 2px; font-size: 13px; line-height: 1.2; cursor: pointer; }
  .knopki button.vybor { background: var(--akcent); border-color: var(--akcent); color: #fff; }
  .niz { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; background: var(--fon);
         border-top: 1px solid var(--liniya); }
  .niz button { width: 100%; max-width: 640px; display: block; margin: 0 auto; border: 0; border-radius: 12px;
                padding: 14px; font-size: 16px; font-weight: 600; background: var(--akcent); color: #fff; }
  .v-telegram .niz { display: none; }
  .v-telegram main { padding-bottom: 24px; }
</style>
</head>
<body>
<div class="shapka">
  <h1>Насколько это про Вас?</h1>
  <div class="podsk">Отвечайте первым откликом и думайте о том, как бывает обычно, по жизни.</div>
  <div class="polosa"><div id="polosa"></div></div>
</div>
<main id="spisok"></main>
<div class="niz"><button id="otpravit">Отправить и получить расшифровку</button></div>

<script>
const VOPROSY = ["Хочу, чтобы важные решения за меня принимал кто-то другой.", "Мне сложно начать что-то новое, нужна поддержка или пинок.", "Стремлюсь к лидирующим позициям.", "Люблю жить с удовольствием и без усилий.", "Люблю давать советы и поправлять собеседников.", "Верю в чудеса.", "Не люблю показывать людям свои сильные эмоции.", "Неохотно доверяю людям.", "Не люблю перемен.", "Начатое дело довожу до конца.", "Люблю экспериментировать везде и во всём.", "Люблю немного приукрасить, чтобы рассказ был ярче.", "Денежные доходы и расходы держу под жёстким контролем.", "Мечтаю о духовной, возвышенной и чистой любви.", "Разговариваю тихо, и люди часто просят повторить погромче.", "Мне нравится незаметно управлять событиями, людьми, оставаясь в тени.", "Люблю командные игры, проекты, соревнования.", "Могу концентрировать внимание длительное время.", "Мне чаще жарко, чем холодно.", "Громко говорить и смеяться: это мой стиль.", "Режим дня и дисциплина очень важны в жизни.", "Я очень впечатлительный и эмоциональный человек.", "После полуночи голова соображает лучше всего.", "Я хорошо вижу скрытые намерения людей.", "Меня трудно вывести из себя, но если уж вывели, остановить меня сложно.", "Я всё делаю не спеша.", "Быстро принимаю решения и везде успеваю.", "Обычно я говорю больше, чем мои собеседники.", "Подарки должны быть полезными.", "Красивые безделушки: моя слабость.", "В разговоре могу не смотреть собеседнику в глаза: я его слушаю.", "Интуиция часто выручает меня: чую опасность за версту.", "Во мне столько силы, что не знаю, куда её деть.", "Аккуратно складываю вещи и не люблю, когда их переставляют.", "Люблю риск и экстремальные развлечения.", "Крепкое словцо к месту может доставить мне удовольствие.", "Если меня просят что-то сделать, хочу, чтобы за это заплатили.", "Читая книги, я ясно вижу сюжеты, лица героев, обстановку.", "Люблю слушать музыку или книги в наушниках.", "Лучше сто раз перестраховаться, чем один раз пострадать.", "Меня раздражают заумные люди.", "Часто опаздываю, вовремя прихожу редко.", "Создаю и поддерживаю беспорядок, не люблю убираться.", "Люблю караоке.", "Не люблю делиться вещами.", "Могу поплакать от эмоционального фильма или спектакля.", "Люблю погрузиться в себя и могу долго оттуда не выходить.", "Мне достаточно комфорта, а роскошь не нужна.", "Чаще у меня получается что-то сломать, чем починить руками.", "Чистота и порядок: вот моё кредо.", "Я люблю и умею делать несколько дел одновременно.", "Лучшее общение за вкусным столом или чашкой чая.", "Правила превыше всего, и для меня, и для всех.", "У меня хорошая память на лица.", "Люблю красивые мелодии и портится настроение от фальши.", "Я не очень люблю находиться среди людей, часто меня влечёт к одиночеству.", "Если меня оскорбят, могу ответить силой.", "Я настойчивый и терпеливый человек.", "В партнёре сначала оцениваю сексуальность, всё остальное потом.", "Я часто покусываю губы.", "Люблю массаж, даже если немного больно.", "Люблю красивую и яркую одежду.", "Меня раздражают громкие звуки, шум, крики, ругань.", "У меня очень тонкое обоняние, различаю ароматы как парфюмер.", "Люблю поработать физически, не напрягая мозги.", "Пользуюсь туалетом только дома, в чужом мне неуютно.", "Свобода и независимость для меня главные ценности в жизни.", "Люблю приготовить что-нибудь вкусненькое.", "Люблю объятия, почёсывания и поглаживания.", "Созерцать красоту природы могу часами.", "Хорошо воспринимаю и запоминаю информацию на слух.", "Люблю обсуждать интриги, сплетни и иногда даже поучаствовать.", "Если иду в спортзал, то на силовые тренировки.", "Главное для меня структура, в хаосе я теряюсь.", "Мне наплевать, что другие подумают о моих поступках.", "Одна и та же еда каждый день для меня невыносима.", "Хорошо чувствую время и никогда не опаздываю.", "Люблю, когда меня нежно целуют в глаза.", "Люблю, когда меня нежно целуют в уши.", "Запахи сильно влияют на моё состояние."];
const VARIANTY = [["Не про меня", 0], ["Есть немного", 3], ["Больше подходит", 7], ["Точно я", 10]];
const otvety = new Array(VOPROSY.length).fill(null);
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;

const spisok = document.getElementById("spisok");
VOPROSY.forEach((t, i) => {
  const d = document.createElement("div");
  d.className = "vopros";
  d.innerHTML = `<p><span class="n">${i + 1}.</span>${t}</p><div class="knopki"></div>`;
  const k = d.querySelector(".knopki");
  VARIANTY.forEach(([nazv, ball]) => {
    const b = document.createElement("button");
    b.textContent = nazv;
    b.onclick = () => {
      otvety[i] = ball;
      k.querySelectorAll("button").forEach(x => x.classList.remove("vybor"));
      b.classList.add("vybor");
      d.classList.add("est");
      obnovit();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    };
    k.appendChild(b);
  });
  spisok.appendChild(d);
});

function skolko() { return otvety.filter(x => x !== null).length; }
function obnovit() {
  const n = skolko();
  document.getElementById("polosa").style.width = (n / VOPROSY.length * 100) + "%";
  if (tg) tg.MainButton.setText(`Отправить и получить расшифровку · ${n} из ${VOPROSY.length}`);
}

function otpravit() {
  const pusto = VOPROSY.length - skolko();
  const dalshe = () => {
    // 80 ответов по 2 бита (номер кнопки) → 20 байт → base64url, уходит в бот ссылкой ?start=v<код>
    const bayty = new Uint8Array(20);
    otvety.forEach((x, n) => {
      const k = x === null ? 0 : VARIANTY.findIndex(v => v[1] === x);
      bayty[n >> 2] |= k << (2 * (n % 4));
    });
    const kod = btoa(String.fromCharCode(...bayty)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const ssylka = "https://t.me/innazhurbina_bot?start=v" + kod;
    if (tg) { tg.openTelegramLink(ssylka); tg.close(); }
    else alert("Проверка вне Telegram. Ссылка:\n" + ssylka);
  };
  if (pusto > 0) {
    const vopr = `Не отмечено утверждений: ${pusto}. Они засчитаются как «не про меня». Отправить?`;
    if (tg) tg.showConfirm(vopr, ok => { if (ok) dalshe(); });
    else if (confirm(vopr)) dalshe();
  } else dalshe();
}

if (tg) {
  document.body.classList.add("v-telegram");
  tg.ready();
  tg.expand();
  tg.MainButton.setParams({color: "#2A5D67", text_color: "#ffffff"});
  tg.MainButton.onClick(otpravit);
  tg.MainButton.show();
}
document.getElementById("otpravit").onclick = otpravit;
obnovit();
</script>
</body>
</html>
